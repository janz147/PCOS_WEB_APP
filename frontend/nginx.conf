# Cache Google News responses so we don't hit them on every page load
proxy_cache_path /var/cache/nginx/gnews levels=1:2 keys_zone=gnews:10m max_size=50m inactive=1h;

server {
    listen 80;

    # Proxy Google News RSS (browsers can't call it directly: no CORS)
    location /gnews/ {
        # Docker's built-in DNS; resolves at request time, so startup never fails
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $gnews_host news.google.com;

        rewrite ^/gnews/(.*)$ /$1 break;
        proxy_pass https://$gnews_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host news.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; OvaMetrics/1.0)";

        proxy_cache gnews;
        proxy_cache_valid 200 15m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve React build
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}